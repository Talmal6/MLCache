services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mlcache
      POSTGRES_USER: mlcache
      POSTGRES_PASSWORD: mlcache
    ports:
      - "${MLCACHE_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlcache -d mlcache"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - mlcache-postgres-data:/var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mlcache
      MYSQL_USER: mlcache
      MYSQL_PASSWORD: mlcache
      MYSQL_ROOT_PASSWORD: mlcache
    ports:
      - "${MLCACHE_MYSQL_PORT:-33306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -umlcache -pmlcache --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - mlcache-mysql-data:/var/lib/mysql

volumes:
  mlcache-postgres-data:
  mlcache-mysql-data:
