[project]
name = "semantic-desider"
version = "0.1.0"
description = "Interface-only semantic cache oracle contracts."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.2",
    "xgboost>=1.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
