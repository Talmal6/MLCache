[project]
name = "semantic-desider"
version = "0.1.0"
description = "Correctness-controlled online semantic cache contracts and runtime boundaries."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
]

[project.scripts]
mlcache-smoke = "mlcache.cli:main"

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.2",
    "xgboost>=1.7",
]
embeddings = [
    "sentence-transformers>=2.7",
]
llm = [
    "openai>=1.0",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
]
dev = [
    "pytest>=7",
]
all = [
    "scikit-learn>=1.2",
    "xgboost>=1.7",
    "pytest>=7",
    "sentence-transformers>=2.7",
    "openai>=1.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that may require optional embedding models or network access",
]
